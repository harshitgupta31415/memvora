name: Project checks

on:
  push:
    branches: [harshitgupta31415/main]
  pull_request:
    branches: [harshitgupta31415/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run acceptance:github-oauth
      - run: npm run acceptance:journal
      - run: npm run acceptance:synthesis
      - run: npm run acceptance:directory
      - run: npm run acceptance:setup
      - run: npm run acceptance:backup
      - run: npm run acceptance:outbox
      - run: npm run acceptance:raw-recall
      - run: npm run evaluate:retrieval
      - run: npm run package:clients
      - run: npm run acceptance:clients

  portable_clients_node26:
    name: Client package (${{ matrix.os }}, Node 26)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build:services
      - run: npm run test:client-artifact
      - run: node scripts/package-clients.mjs
      - run: npm run acceptance:clients
